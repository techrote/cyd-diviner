name: Firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cardputer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build Cardputer firmware
        run: pio run -e cardputer

  cyd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [cyd, cyd-diagnostics, cyd-pcm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build CYD firmware
        run: pio run -e ${{ matrix.target }}

  vlc-plugin:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the VLC plugin DLL
        shell: pwsh
        run: ./tools/vlc/build.ps1
