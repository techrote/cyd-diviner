name: Independent firmware audit fixtures

on:
  push:
    branches: [mission/firmware-audit]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test installed dependency metadata and existing packaging contracts
        run: |
          python tests/dependency_metadata_test.py
          python tests/package_firmware_test.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46112001450
          pattern: firmware-cyd*
          path: audit-input
      - name: Audit real firmware bytes and reject a corrupted delivery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          source = "8d74b4b68883c1691ad0e8d75d923385695af78e"
          output = Path("audit-output")
          output.mkdir()
          paths = sorted(Path("audit-input").glob("firmware-*"))
          assert len(paths) == 3, paths
          reports = []
          for path in paths:
              env = path.name[len("firmware-"):-41]
              report = output / (env + ".json")
              command = [sys.executable, "tools/audit_firmware.py", str(path),
                         "--source", source, "--environment", env, "--repository", ".",
                         "--output", str(report)]
              result = subprocess.run(command, text=True, capture_output=True, timeout=60)
              print(result.stdout, end="")
              print(result.stderr, end="", file=sys.stderr)
              assert result.returncode == 0, result
              receipt = json.loads(report.read_text())
              assert receipt["status"] == "PASS"
              reports.append(receipt)
          damaged = Path("damaged-bundle")
          shutil.copytree(paths[0], damaged)
          firmware = damaged / "firmware.bin"
          data = bytearray(firmware.read_bytes())
          data[100] ^= 1
          firmware.write_bytes(data)
          env = paths[0].name[len("firmware-"):-41]
          failure = subprocess.run([sys.executable, "tools/audit_firmware.py", str(damaged),
                                    "--source", source, "--environment", env, "--repository", "."],
                                   text=True, capture_output=True, timeout=60)
          negative = json.loads(failure.stdout)
          assert failure.returncode == 1 and negative["status"] == "FAIL", negative
          assert "checksum mismatch" in negative["error"], negative
          (output / "corruption-rejected.json").write_text(json.dumps(negative, indent=2) + "\n")
          (output / "summary.json").write_text(json.dumps({"status":"PASS",
              "audited_source":source, "profiles":[r["environment"] for r in reports],
              "corruption_rejection":"PASS", "physical_execution":"NOT RUN"}, indent=2) + "\n")
          print("PASS: three actual CYD bundles; intentional single-byte corruption rejected")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-firmware-audit-${{ github.sha }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
