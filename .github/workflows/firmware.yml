name: Firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cardputer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build Cardputer firmware
        run: pio run -e cardputer

  cyd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [cyd, cyd-diagnostics, cyd-pcm, cyd-profile, kernel-esp32, kernel-s3, kernel-c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build CYD firmware
        run: pio run -e ${{ matrix.target }}

  vlc-plugin:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the VLC plugin DLL
        shell: pwsh
        run: ./tools/vlc/build.ps1

  performance-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture dependency
        run: python -m pip install -r tools/perf/requirements.txt
      - name: Validate serial capture and evidence interpretation
        run: python -m unittest discover -s tools/perf -p 'test_*.py' -v
      - name: Validate portable kernels with independent numeric oracles
        run: python tools/perf/validate_kernels.py --sanitize

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          python -m pip install platformio==6.2.0
      - name: Build and replay ordinary native firmware
        run: |
          pio run -e native
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy GRIM_SCRIPT='100:key:x;600:key:1;1400:esc;1600:key:5;2600:quit' .pio/build/native/program
