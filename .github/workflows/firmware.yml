name: Firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cardputer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build Cardputer firmware
        run: pio run -e cardputer

  cyd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [cyd, cyd-diagnostics, cyd-pcm, cyd-profile, cyd-profile-events, cyd-profile-link, cyd-profile-color, cyd-profile-audio, kernel-esp32, kernel-esp32-audio, kernel-s3, kernel-s3-n4r2, kernel-s3-n4r2-peer, kernel-s3-n4r2-audio, kernel-c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build CYD firmware
        run: pio run -e ${{ matrix.target }}

  vlc-plugin:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the VLC plugin DLL
        shell: pwsh
        run: ./tools/vlc/build.ps1

  performance-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture and analysis dependencies
        run: python -m pip install -r tools/perf/requirements.txt -r tools/perf/analysis-requirements.txt
      - name: Validate serial capture and evidence interpretation
        run: python -m unittest discover -s tools/perf -p 'test_*.py' -v
      - name: Validate portable kernels with independent numeric oracles
        run: python tools/perf/validate_kernels.py --sanitize
      - name: Check bounded telemetry record capacity
        run: python tools/perf/check_output_bounds.py
      - name: Validate bounded I2S event aggregation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tools/perf/test_i2s_events.cpp -o /tmp/cyd-i2s-events-test
          /tmp/cyd-i2s-events-test
      - name: Validate packed colour and bounded audio cores
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc tools/perf/test_color_packing.cpp -o /tmp/cyd-color-packing-test
          /tmp/cyd-color-packing-test
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -DGRIM_PERF=1 -DGRIM_PERF_COLOR=1 -Itools/perf/fakes/color tools/perf/test_color_pipeline.cpp src/perf_color.cpp -o /tmp/cyd-color-pipeline-test
          /tmp/cyd-color-pipeline-test
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc -DGRIM_PERF_AUDIO_CORE_STANDALONE=1 tools/perf/test_audio_core.cpp src/perf_audio_core.cpp -o /tmp/cyd-audio-core-test
          /tmp/cyd-audio-core-test
      - name: Validate greenfield SDR framing and host demodulation models
        run: |
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined experiments/sdr/test_protocol.cpp experiments/sdr/protocol.cpp -o /tmp/cyd-sdr-protocol-test
          /tmp/cyd-sdr-protocol-test
          /tmp/cyd-sdr-protocol-test --low-sps-tests
      - name: Validate isolated SDR register and memory contracts
        run: |
          python experiments/sdr-metal/test_tx_lifecycle.py
          python experiments/sdr-metal/rx/test_snapshot_host.py --output /tmp/cyd-metal-rx-tests
          python experiments/sdr-metal/rx/test_output_bounds.py
          gcc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined experiments/sdr-metal/tx/test_words.c -o /tmp/cyd-metal-tx-words
          /tmp/cyd-metal-tx-words
          gcc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined experiments/sdr-metal/tx-s3/test_words.c -o /tmp/cyd-metal-tx-s3-words
          /tmp/cyd-metal-tx-s3-words

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          python -m pip install platformio==6.2.0
      - name: Build and replay ordinary native firmware
        run: |
          pio run -e native
          SDL_VIDEODRIVER=offscreen SDL_AUDIODRIVER=dummy GRIM_SCRIPT='100:key:x;600:key:1;1400:esc;1600:key:5;2600:quit' .pio/build/native/program
