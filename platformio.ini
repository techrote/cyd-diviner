; Daedric Grimoire — a companion app for the Daedric Launcher on the
; M5Stack Cardputer ADV: drone box, step sequencer, bytebeat livecoder,
; ASCII 3D and visions, in the same blood/ember skin.
;
;   pio run -e cardputer            -> .pio/build/cardputer/firmware.bin (install via Launcher SD)
;   pio run -e cyd -t upload        -> ESP32-2432S028R over USB serial
;   pio run -e cyd-pcm -t upload    -> CYD with 24 kHz USB serial audio
;   pio run -e native -t exec       -> SDL window on the desktop (see src/hal_native.cpp)

[platformio]
default_envs = cardputer

[env:cardputer]
extra_scripts =
    pre:tools/source_identity.py
    post:tools/firmware_metadata.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
	-std=gnu++17
	-O2
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DGRIM_DEVICE=1
lib_deps =
	m5stack/M5Cardputer @ 1.1.1
	m5stack/M5Unified @ 0.2.24
	m5stack/M5GFX @ 0.2.31
	z3t0/IRremote @ 4.4.1
build_src_filter = +<*> -<hal_native.cpp> -<hal_cyd.cpp> -<cyd_controls.cpp> -<net_native.cpp>
monitor_speed = 115200

[env:cyd]
extra_scripts =
    pre:tools/source_identity.py
    post:tools/firmware_metadata.py
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-O2
	-DGRIM_DEVICE=1
	-DGRIM_CYD=1
	-DLGFX_USE_V1
lib_deps =
	lovyan03/LovyanGFX @ 1.2.32
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_src_filter = +<*> -<hal_device.cpp> -<hal_native.cpp> -<net_native.cpp> -<apps/ir.cpp> -<apps/probe.cpp>
monitor_speed = 115200

[env:cyd-diagnostics]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DGRIM_CYD_DIAGNOSTICS=1

[env:cyd-pcm]
extends = env:cyd
build_src_flags = -DGRIM_CYD_PCM=1
monitor_speed = 533333

[env:native]
extra_scripts = pre:tools/source_identity.py
platform = native @ 1.2.1
build_flags =
	-std=c++17
	-O2
	-lSDL2
	-lpthread
	-DGRIM_NATIVE=1
	-DLGFX_USE_V1
lib_deps =
	lovyan03/LovyanGFX @ 1.2.32
build_src_filter = +<*> -<hal_device.cpp> -<hal_cyd.cpp> -<cyd_controls.cpp> -<net_device.cpp>

; Same CYD touch controller and canvas layout, rendered by the SDL HAL.
; Physical radio, DAC/USB timing and NVS wear remain device-only evaluations.
[env:native-cyd]
extends = env:native
build_flags = ${env:native.build_flags} -DGRIM_CYD=1
build_src_filter = +<*> -<hal_device.cpp> -<hal_cyd.cpp> -<net_device.cpp> -<apps/ir.cpp> -<apps/probe.cpp>
