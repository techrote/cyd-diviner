; Daedric Grimoire — a companion app for the Daedric Launcher on the
; M5Stack Cardputer ADV: drone box, step sequencer, bytebeat livecoder,
; ASCII 3D and visions, in the same blood/ember skin.
;
;   pio run -e cardputer            -> .pio/build/cardputer/firmware.bin (install via Launcher SD)
;   pio run -e cyd -t upload        -> ESP32-2432S028R over USB serial
;   pio run -e cyd-pcm -t upload    -> CYD with 24 kHz USB serial audio
;   pio run -e native -t exec       -> SDL window on the desktop (see src/hal_native.cpp)

[platformio]
default_envs = cardputer

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
	-std=gnu++17
	-O2
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DGRIM_DEVICE=1
lib_deps =
	m5stack/M5Cardputer @ 1.1.1
	m5stack/M5Unified @ 0.2.24
	m5stack/M5GFX @ 0.2.31
build_src_filter = +<*> -<hal_native.cpp> -<hal_cyd.cpp> -<cyd_controls.cpp> -<net_native.cpp>
monitor_speed = 115200

[env:cyd]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-O2
	-DGRIM_DEVICE=1
	-DGRIM_CYD=1
	-DLGFX_USE_V1
lib_deps =
	lovyan03/LovyanGFX @ 1.2.32
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_src_filter = +<*> -<hal_device.cpp> -<hal_native.cpp> -<net_native.cpp> -<apps/ir.cpp> -<apps/probe.cpp>
monitor_speed = 115200

[env:cyd-diagnostics]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DGRIM_CYD_DIAGNOSTICS=1

[env:cyd-pcm]
extends = env:cyd
build_src_flags = -DGRIM_CYD_PCM=1
monitor_speed = 533333

; Explicitly opt in: these images are unapproved characterisation evidence.
; The ordinary firmware environments above retain their original flags.
[env:cyd-profile]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DGRIM_CYD_DIAGNOSTICS=1 -DGRIM_CYD_PCM=1 -DGRIM_PERF=1
extra_scripts = pre:tools/perf/identity.py
monitor_speed = 533333

[env:cyd-profile-events]
extends = env:cyd-profile
build_flags = ${env:cyd-profile.build_flags} -DGRIM_PERF_I2S_EVENTS=1

[env:kernel-esp32]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -O2 -DGRIM_PERF_KERNEL_STANDALONE=1
build_src_filter = -<*> +<perf_kernels.cpp> +<perf_kernel_main.cpp>
extra_scripts = pre:tools/perf/identity.py
monitor_speed = 115200

[env:kernel-s3]
extends = env:kernel-esp32
board = esp32-s3-devkitc-1

; Physically identified COM22 package: embedded 4 MB flash, 2 MB quad PSRAM.
; Native USB Serial/JTAG, not the DevKit's external UART default.
[env:kernel-s3-n4r2]
extends = env:kernel-s3
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = default.csv
build_flags = ${env:kernel-esp32.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DBOARD_HAS_PSRAM

[env:kernel-s3-n4r2-peer]
extends = env:kernel-s3-n4r2
board_build.partitions = huge_app.csv
build_flags = ${env:kernel-s3-n4r2.build_flags} -DGRIM_PERF_LINK=1 -DGRIM_PERF_LINK_PEER=1
build_src_filter = -<*> +<perf_kernels.cpp> +<perf_kernel_main.cpp> +<perf_link.cpp> +<perf_ble.cpp>

[env:cyd-profile-link]
extends = env:cyd-profile-events
build_flags = ${env:cyd-profile-events.build_flags} -DGRIM_PERF_LINK=1

; Additional opt-in packed-colour/compositing characterization only.
[env:cyd-profile-color]
extends = env:cyd-profile-link
build_flags = ${env:cyd-profile-link.build_flags} -DGRIM_PERF_COLOR=1

; Finite digital audio transport/reconstruction experiments, idle until commanded.
[env:cyd-profile-audio]
extends = env:cyd-profile-color
build_flags = ${env:cyd-profile-color.build_flags} -DGRIM_PERF_AUDIO_MVP=1

[env:kernel-s3-n4r2-audio]
extends = env:kernel-s3-n4r2-peer
build_flags = ${env:kernel-s3-n4r2-peer.build_flags} -DGRIM_PERF_AUDIO_MVP=1
build_src_filter = ${env:kernel-s3-n4r2-peer.build_src_filter} +<perf_audio_core.cpp> +<perf_audio_mvp.cpp>

[env:kernel-c3]
extends = env:kernel-esp32
board = esp32-c3-devkitm-1

[env:native]
platform = native
build_flags =
	-std=c++17
	-O2
	-lSDL2
	-lpthread
	-DGRIM_NATIVE=1
	-DLGFX_USE_V1
lib_deps =
	lovyan03/LovyanGFX @ 1.2.32
build_src_filter = +<*> -<hal_device.cpp> -<hal_cyd.cpp> -<cyd_controls.cpp> -<net_device.cpp>
